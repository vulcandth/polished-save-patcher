<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Polished Save Patcher (Local)</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Polished Save Patcher (Local)</h1>
        <p class="muted">
          This is a minimal local demo that loads the WASM package built by
          <code>wasm-pack</code>.
        </p>
      </header>

      <section class="card">
        <h2>1) Select a save</h2>
        <input id="file" type="file" accept=".sav,application/octet-stream" />
        <div class="row">
          <button id="detect" disabled>Detect version</button>
          <span id="detected" class="pill muted">No file loaded</span>
        </div>
      </section>

      <section class="card">
        <h2>2) Patch</h2>
        <div class="grid">
          <label>
            Target version (u16)
            <input id="targetVersion" type="number" min="0" max="65535" value="10" />
          </label>
          <label>
            Dev type (u8)
            <input id="devType" type="number" min="0" max="255" value="0" />
          </label>
        </div>
        <div class="row">
          <button id="patch" disabled>Patch with log</button>
          <button id="download" disabled>Download patched .sav</button>
        </div>
      </section>

      <section class="card">
        <h2>Logs</h2>
        <pre id="logs" class="logs">(no output yet)</pre>
      </section>

      <footer class="muted">
        Tip: build the WASM package with <code>wasm-pack build --release --target web</code>,
        then serve the repo root and open <code>/web/</code>.
      </footer>
    </main>

    <script type="module">
      const ui = {
        file: document.getElementById('file'),
        detect: document.getElementById('detect'),
        detected: document.getElementById('detected'),
        targetVersion: document.getElementById('targetVersion'),
        devType: document.getElementById('devType'),
        patch: document.getElementById('patch'),
        download: document.getElementById('download'),
        logs: document.getElementById('logs'),
      };

      let inputBytes = null;
      let lastPatchedBytes = null;

      function setStatus(text, kind = 'muted') {
        ui.detected.textContent = text;
        ui.detected.className = `pill ${kind}`;
      }

      function setLogs(obj) {
        ui.logs.textContent =
          typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
      }

      function u8aFromFile(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(reader.error);
          reader.onload = () => resolve(new Uint8Array(reader.result));
          reader.readAsArrayBuffer(file);
        });
      }

      function downloadBytes(bytes, filename) {
        const blob = new Blob([bytes], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      // wasm-pack outputs into /pkg at the repo root.
      const wasm = await import('../pkg/gb_save_polished.js');
      await wasm.default();

      const { get_save_version, patch_save_with_log } = wasm;

      ui.file.addEventListener('change', async () => {
        lastPatchedBytes = null;
        ui.download.disabled = true;

        const file = ui.file.files?.[0];
        if (!file) {
          inputBytes = null;
          ui.detect.disabled = true;
          ui.patch.disabled = true;
          setStatus('No file loaded');
          setLogs('(no output yet)');
          return;
        }

        inputBytes = await u8aFromFile(file);
        ui.detect.disabled = false;
        ui.patch.disabled = false;
        setStatus(`Loaded ${file.name} (${inputBytes.length} bytes)`);
        setLogs('(ready)');
      });

      ui.detect.addEventListener('click', async () => {
        try {
          const version = await get_save_version(inputBytes);
          setStatus(`Detected version: ${version}`, 'ok');
        } catch (e) {
          setStatus('Detect failed', 'err');
          setLogs(String(e));
        }
      });

      ui.patch.addEventListener('click', async () => {
        try {
          const targetVersion = Number(ui.targetVersion.value);
          const devType = Number(ui.devType.value);

          const outcome = patch_save_with_log(inputBytes, targetVersion, devType);
          setLogs(outcome);

          if (outcome?.ok && outcome?.bytes) {
            lastPatchedBytes = outcome.bytes;
            ui.download.disabled = false;
            setStatus('Patch OK', 'ok');
          } else {
            lastPatchedBytes = null;
            ui.download.disabled = true;
            setStatus('Patch failed', 'err');
          }
        } catch (e) {
          setStatus('Patch crashed', 'err');
          setLogs(String(e));
        }
      });

      ui.download.addEventListener('click', () => {
        if (!lastPatchedBytes) return;
        downloadBytes(lastPatchedBytes, 'patched_save.sav');
      });
    </script>
  </body>
</html>
