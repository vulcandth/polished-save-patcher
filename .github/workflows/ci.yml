name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: fmt / clippy / test
    runs-on: ubuntu-latest

    steps:
      # Check out this repo into a subfolder so we can check out gb-save-patcher
      # alongside it and keep the ../gb-save-patcher path dependencies working.
      - name: Checkout polished-save-patcher
        uses: actions/checkout@v4
        with:
          path: polished-save-patcher

      - name: Checkout gb-save-patcher (sibling repo)
        uses: actions/checkout@v4
        with:
          repository: vulcandth/gb-save-patcher
          path: gb-save-patcher

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            polished-save-patcher

      - name: cargo fmt
        working-directory: polished-save-patcher
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: polished-save-patcher
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        working-directory: polished-save-patcher
        run: cargo test

  pages:
    name: Build web + deploy Pages
    runs-on: ubuntu-latest
    needs: [test]

    # Only deploy from the default branch.
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout polished-save-patcher
        uses: actions/checkout@v4
        with:
          path: polished-save-patcher

      - name: Checkout gb-save-patcher (sibling repo)
        uses: actions/checkout@v4
        with:
          repository: vulcandth/gb-save-patcher
          path: gb-save-patcher

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build WASM package
        working-directory: polished-save-patcher
        run: wasm-pack build --release --target web

      - name: Build Pages site (dist/)
        working-directory: polished-save-patcher
        run: |
          rm -rf dist
          mkdir -p dist
          # Use the upstream game-agnostic web UI from gb-save-web.
          cp -R ../gb-save-patcher/crates/gb-save-web/www/* dist/

          # Override the site configuration for this game.
          cat > dist/config.js <<'EOF'
          export const SITE_CONFIG = {
            game: {
              title: "Polished Crystal Save Patcher",
              subtitle: "Patches your save in your browser (no uploads).",
              githubUrl: "https://github.com/vulcandth/polished-save-patcher",
              githubLabel: "View source",
            },

            wasm: {
              modulePath: "./pkg/gb_save_polished.js",
            },

            ui: {
              showAdvancedMode: true,
            },

            instructions: [
              "Back up your original save file somewhere safe.",
              "Choose your save file below.",
              "Pick a target version, then click Patch.",
              "Download the patched save and load it in your emulator/flashcart.",
            ],

            targetVersions: [
              { value: 8, label: "v8" },
              { value: 9, label: "v9" },
              { value: 10, label: "Latest (v10)" },
            ],

            acceptedExtensions: [".sav", ".srm"],
          };
          EOF

          # Replace the upstream placeholder pkg/ with this repo's wasm-pack output.
          rm -rf dist/pkg
          cp -R pkg dist/pkg

          # If the module graph fails to load (e.g., missing config.js/pkg),
          # show a visible error instead of leaving the default "loading…".
          python3 - <<'PY'
          from pathlib import Path

          p = Path('dist/index.html')
          html = p.read_text(encoding='utf-8')
          old = '<script type="module" src="./main.js"></script>'
          if old in html:
            html = html.replace(
              old,
              """<script type=\"module\">
  const setText = (id, text) => {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
  };

  import('./main.js').catch((e) => {
    setText('wasmState', 'failed');
    const msg = String((e && (e.message || e)) || e);
    setText('status', 'Failed to load UI/wasm: ' + msg);
    console.error(e);
  });
</script>""",
            )
            p.write_text(html, encoding='utf-8')
          else:
            raise SystemExit('Expected module script tag not found in dist/index.html')
          PY
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: polished-save-patcher/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
