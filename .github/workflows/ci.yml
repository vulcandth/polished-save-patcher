name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: fmt / clippy / test
    runs-on: ubuntu-latest

    steps:
      # Check out this repo into a subfolder so we can check out gb-save-patcher
      # alongside it and keep the ../gb-save-patcher path dependencies working.
      - name: Checkout polished-save-patcher
        uses: actions/checkout@v4
        with:
          path: polished-save-patcher

      - name: Checkout gb-save-patcher (sibling repo)
        uses: actions/checkout@v4
        with:
          repository: vulcandth/gb-save-patcher
          path: gb-save-patcher

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            polished-save-patcher

      - name: cargo fmt
        working-directory: polished-save-patcher
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: polished-save-patcher
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        working-directory: polished-save-patcher
        run: cargo test

  pages:
    name: Build web + deploy Pages
    runs-on: ubuntu-latest
    needs: [test]

    # Only deploy from the default branch.
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout polished-save-patcher
        uses: actions/checkout@v4
        with:
          path: polished-save-patcher

      - name: Checkout gb-save-patcher (sibling repo)
        uses: actions/checkout@v4
        with:
          repository: vulcandth/gb-save-patcher
          path: gb-save-patcher

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build WASM package
        working-directory: polished-save-patcher
        run: wasm-pack build --release --target web

      - name: Build Pages site (dist/)
        working-directory: polished-save-patcher
        run: |
          rm -rf dist
          mkdir -p dist
          # Serve the app at the Pages root, and also keep /web/ working.
          cp web/index.html dist/index.html
          cp web/styles.css dist/styles.css
          cp -R web dist/web
          cp -R pkg dist/pkg
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: polished-save-patcher/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
